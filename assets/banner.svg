<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Buffet Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#229ED9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b3c53" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- декоративные кружки -->
  <circle cx="1040" cy="70" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="1140" cy="250" r="90" fill="#ffffff" opacity="0.06"/>

  <!-- эмодзи-иконки блюд -->
  <text x="880" y="205" font-size="120" text-anchor="middle" filter="url(#shadow)">🍕</text>
  <text x="1000" y="150" font-size="70" text-anchor="middle" opacity="0.95">🥟</text>
  <text x="1030" y="240" font-size="64" text-anchor="middle" opacity="0.95">☕</text>

  <!-- заголовок -->
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Буфет · Bot</text>
  <text x="82" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#eaf7ff">Telegram-магазин буфета: меню, корзина и оплата прямо в чате</text>

  <!-- бейджи -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#229ED9">
    <rect x="82" y="238" width="150" height="44" rx="22" fill="#ffffff"/>
    <text x="157" y="267" text-anchor="middle">Python</text>
    <rect x="246" y="238" width="160" height="44" rx="22" fill="#ffffff"/>
    <text x="326" y="267" text-anchor="middle">aiogram</text>
    <rect x="420" y="238" width="170" height="44" rx="22" fill="#ffffff"/>
    <text x="505" y="267" text-anchor="middle">SQLite</text>
  </g>
</svg>
